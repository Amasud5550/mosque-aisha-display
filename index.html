<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <!-- Only this site's own script may run; data only from the mosque API and this GitHub repo -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://api.mosqueaisha.ca https://api.github.com https://raw.githubusercontent.com https://fonts.googleapis.com https://fonts.gstatic.com https://mosqueaisha.ca; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Mosque Aisha Display</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy-900: #070d1c;
      --navy-800: #0d1629;
      --navy-700: #142039;
      --gold: #ad8018;
      --gold-bright: #d9a83a;
      --gold-soft: rgba(173, 128, 24, 0.14);
      --ink: #f1ede4;
      --ink-dim: #e2e2e2;
      --muted: rgba(226, 226, 226, 0.58);
      --faint: rgba(226, 226, 226, 0.32);
      --line: rgba(226, 226, 226, 0.09);
      --ok: #7fcf9a;
      --warn: #f0b85a;

      --serif: "Cinzel", "Times New Roman", serif;
      --sans: "Raleway", "Segoe UI", Arial, sans-serif;
      --arabic: "Amiri", "Traditional Arabic", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--navy-900);
      color: var(--ink);
      font-family: var(--sans);
      cursor: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Raleway defaults to old-style figures; force lining, fixed-width digits everywhere */
    body { font-feature-settings: "lnum" 1, "tnum" 1; }

    /* Fixed 1080x1920 canvas, scaled to whatever screen it lands on */
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1080px;
      height: 1920px;
      transform: translate(-50%, -50%);
      transform-origin: center center;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 52px 56px 40px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      background:
        radial-gradient(900px 520px at 50% -120px, rgba(173, 128, 24, 0.22), transparent 70%),
        linear-gradient(180deg, var(--navy-800) 0%, var(--navy-900) 100%);
      overflow: hidden;
    }

    /* Faint arch outline, echoing the arches on mosqueaisha.ca */
    .screen::before {
      content: "";
      position: absolute;
      left: 90px;
      right: 90px;
      top: 150px;
      height: 350px;
      border: 2px solid rgba(173, 128, 24, 0.16);
      border-bottom: none;
      border-radius: 450px 450px 0 0;
      pointer-events: none;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      align-items: center;
      gap: 26px;
      position: relative;
    }

    .logo {
      width: 108px;
      height: 108px;
      object-fit: contain;
      flex: none;
    }

    .brand { display: flex; flex-direction: column; gap: 6px; }

    .brand h1 {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 60px;
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--ink);
    }

    .brand .location {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-bright);
    }

    /* ---------- Clock ---------- */
    .clock {
      position: relative;
      text-align: center;
      padding-top: 18px;
    }

    .time {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 196px;
      line-height: 1;
      letter-spacing: 0.01em;
      color: var(--ink);
      display: inline-flex;
      align-items: baseline;
      gap: 14px;
    }

    .time .sec {
      font-size: 64px;
      color: var(--faint);
      font-weight: 500;
      width: 1.6em;
      text-align: left;
    }

    .time .ap {
      font-family: var(--sans);
      font-size: 44px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-left: -24px;
    }

    .dates {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 4px 20px;
      font-size: 30px;
      font-weight: 500;
      color: var(--ink-dim);
    }

    .dates .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
    }

    .dates .hijri { color: var(--gold-bright); }
    .dates > span { white-space: nowrap; }

    /* ---------- Next prayer ---------- */
    .next {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 30px;
      padding: 34px 44px;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(173, 128, 24, 0.24), rgba(173, 128, 24, 0.06));
      border: 2px solid rgba(217, 168, 58, 0.45);
      box-shadow: 0 30px 80px -40px rgba(173, 128, 24, 0.6);
    }

    .eyebrow {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .next .name-row {
      display: flex;
      align-items: baseline;
      gap: 22px;
      margin-top: 8px;
    }

    .next .name {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 86px;
      line-height: 1;
      color: var(--gold-bright);
    }

    .next .name-ar {
      font-family: var(--arabic);
      font-size: 56px;
      line-height: 1;
      color: rgba(217, 168, 58, 0.75);
    }

    .next .sub {
      margin-top: 14px;
      font-size: 32px;
      font-weight: 500;
      color: var(--ink-dim);
    }

    .next .sub strong { font-weight: 700; color: var(--ink); }

    .next .count-wrap { text-align: right; }

    .next .count {
      margin-top: 6px;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 104px;
      line-height: 1;
      color: var(--ink);
    }

    /* Between adhan and iqamah, and while salah is in progress */
    .next.is-iqamah .count { color: var(--ok); }
    .next.is-now { background: linear-gradient(135deg, rgba(127, 207, 154, 0.22), rgba(127, 207, 154, 0.05)); border-color: rgba(127, 207, 154, 0.5); }
    .next.is-now .name { color: var(--ok); }
    .next.is-now .name-ar { color: rgba(127, 207, 154, 0.75); }
    .next.is-now .count { font-family: var(--sans); font-size: 46px; font-weight: 700; line-height: 1.2; max-width: 380px; }

    /* ---------- Prayer table ---------- */
    .table {
      position: relative;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--line);
      padding: 10px 36px 14px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 205px 235px;
      white-space: nowrap;
      align-items: center;
      column-gap: 10px;
      padding: 0 18px;
      height: 102px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .row:last-child { border-bottom: none; }

    /* Jumu'ah shown every day (except Friday, when it replaces Dhuhr) */
    .table.dense .row:not(.head) { height: 90px; }
    .row.weekly .t { color: var(--ink-dim); font-weight: 700; font-size: 40px; }
    .row.weekly .t .lbl {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--faint);
      margin-right: 6px;
      vertical-align: middle;
    }

    .row.head {
      height: 64px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .row .col-time { text-align: right; }

    .row .pname {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-right: 20px;
      min-width: 0;
    }

    .row .en {
      font-size: 46px;
      font-weight: 600;
      color: var(--ink-dim);
    }

    .row .ar {
      font-family: var(--arabic);
      font-size: 36px;
      color: var(--faint);
    }

    .row .t {
      font-size: 46px;
      font-weight: 500;
      color: var(--muted);
    }

    .row .t.iq {
      font-weight: 700;
      color: var(--ink);
    }

    .row .t small {
      font-size: 0.5em;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-left: 6px;
      color: var(--faint);
    }

    .row.active {
      background: var(--gold-soft);
      border-radius: 20px;
      border-bottom-color: transparent;
    }

    .row.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 18px;
      bottom: 18px;
      width: 6px;
      border-radius: 3px;
      background: var(--gold-bright);
    }

    .row.active .en,
    .row.active .t.iq { color: var(--gold-bright); }
    .row.active .ar { color: rgba(217, 168, 58, 0.7); }
    .row.done .en, .row.done .t { opacity: 0.55; }

    /* ---------- Announcements ---------- */
    .board {
      position: relative;
      flex: 1;
      min-height: 0;
      border-radius: 32px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--line);
    }

    .board img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .board img.show { opacity: 1; }
    .board.empty { display: none; }

    /* ---------- Footer ---------- */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      font-size: 24px;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
    }

    .footer .contact span + span::before {
      content: "•";
      margin: 0 14px;
      color: var(--gold);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      color: var(--faint);
    }

    .status i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ok);
    }

    .status.warn { color: var(--warn); font-weight: 600; }
    .status.warn i { background: var(--warn); }

    /* ---------- Ticker ---------- */
    .ticker {
      display: flex;
      align-items: stretch;
      height: 76px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--line);
      flex: none;
    }

    .ticker.hidden { display: none; }

    .ticker-label {
      flex: none;
      display: flex;
      align-items: center;
      padding: 0 26px;
      background: var(--gold);
      color: var(--navy-900);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .ticker-track {
      position: relative;
      flex: 1;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent);
              mask-image: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent);
    }

    .ticker-inner {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      white-space: nowrap;
      font-size: 34px;
      font-weight: 600;
      color: var(--ink);
      will-change: transform;
      animation: ticker linear infinite;
      animation-duration: 30s;
    }

    .ticker-inner.static { animation: none; position: static; height: 100%; padding-left: 28px; }

    .ticker-inner .msg { padding: 0 34px; }
    .ticker-inner .sep { color: var(--gold-bright); font-size: 22px; }

    @keyframes ticker {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ---------- Urgent alert (replaces slides) ---------- */
    .alert {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 50px 60px;
      text-align: center;
      background: linear-gradient(160deg, rgba(240, 184, 90, 0.20), rgba(240, 184, 90, 0.05));
      border: 3px solid rgba(240, 184, 90, 0.6);
      border-radius: 32px;
    }

    .board.has-alert .alert { display: flex; }
    .board.has-alert img { visibility: hidden; }

    .alert-tag {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--warn);
    }

    .alert-title {
      font-family: var(--serif);
      font-size: 72px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--ink);
    }

    .alert-text {
      font-size: 40px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--ink-dim);
      white-space: pre-line;
    }

    /* ---------- Night dimming ---------- */
    .dim {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 3s ease;
      z-index: 50;
    }

    body.preview { cursor: default; }

    /* =========================================================
       LANDSCAPE (16:9 TVs, e.g. Fire TV): 1920x1080 canvas
       Turns on automatically when the screen is wider than tall,
       or force it with ?layout=landscape / ?layout=portrait
       ========================================================= */
    body.landscape .stage { width: 1920px; height: 1080px; }

    body.landscape .screen {
      display: grid;
      grid-template-columns: 640px minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      grid-template-areas:
        "header clock"
        "table  table"
        "next   board"
        "ticker ticker"
        "footer footer";
      gap: 24px 32px;
      padding: 36px 56px 26px;
    }
    body.landscape .screen::before { display: none; }

    body.landscape .header { grid-area: header; gap: 22px; }
    body.landscape .logo { width: 96px; height: 96px; }
    body.landscape .brand h1 { font-size: 54px; }
    body.landscape .brand .location { font-size: 22px; }

    body.landscape .clock { grid-area: clock; text-align: right; padding-top: 0; align-self: center; }
    body.landscape .time { font-size: 128px; }
    body.landscape .time .sec { font-size: 44px; }
    body.landscape .time .ap { font-size: 34px; margin-left: -16px; }
    body.landscape .dates { justify-content: flex-end; font-size: 28px; margin-top: 8px; }

    /* prayer table becomes a row of tiles */
    body.landscape .table { grid-area: table; padding: 8px; }
    body.landscape .row.head { display: none; }
    body.landscape #rows { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
    body.landscape #rows .row {
      height: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 18px 8px 20px;
      border-bottom: none;
      border-radius: 20px;
      text-align: center;
      white-space: nowrap;
    }
    body.landscape #rows .row .pname { flex-direction: column; align-items: center; gap: 0; padding-right: 0; justify-content: center; }
    body.landscape #rows .row .en { font-size: 40px; }
    body.landscape #rows .row .ar { font-size: 30px; }
    body.landscape #rows .row .col-time { text-align: center; }
    body.landscape #rows .row .t { font-size: 32px; }
    body.landscape #rows .row .t.iq { font-size: 46px; }
    body.landscape #rows .row .t::before {
      content: "Adhan";
      display: block;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 2px;
    }
    body.landscape #rows .row .t.iq::before { content: "Iqamah"; }
    body.landscape #rows .row.weekly .t::before { content: attr(data-label); }
    body.landscape #rows .row.weekly .t { font-size: 40px; }
    body.landscape #rows .row.weekly .t .lbl { display: none; }
    body.landscape #rows .row.weekly .jt-empty { display: none; }
    body.landscape #rows .row.active::before { left: 24px; right: 24px; top: 0; bottom: auto; width: auto; height: 6px; }

    body.landscape .next {
      grid-area: next;
      grid-template-columns: 1fr;
      align-content: center;
      gap: 26px;
      padding: 30px 36px;
    }
    body.landscape .next .count-wrap { text-align: left; }
    body.landscape .next .name { font-size: 72px; }
    body.landscape .next .name-ar { font-size: 48px; }
    body.landscape .next .sub { font-size: 28px; }
    body.landscape .next .count { font-size: 92px; }
    body.landscape .next.is-now .count { font-size: 40px; max-width: none; }

    body.landscape .board { grid-area: board; }
    body.landscape .ticker { grid-area: ticker; height: 64px; }
    body.landscape .ticker-inner { font-size: 30px; }
    body.landscape .footer { grid-area: footer; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="screen">

      <header class="header">
        <img class="logo" src="https://mosqueaisha.ca/assets/logo-clear.png" alt="Mosque Aisha" />
        <div class="brand">
          <h1>Mosque Aisha</h1>
          <div class="location" id="locationName">Stanley Ave · Niagara Falls</div>
        </div>
      </header>

      <section class="clock">
        <div class="time">
          <span id="hm">--:--</span><span class="sec" id="ss">:--</span><span class="ap" id="ap"></span>
        </div>
        <div class="dates">
          <span id="gregorian">--</span>
          <span class="dot"></span>
          <span class="hijri" id="hijri">--</span>
        </div>
      </section>

      <section class="next" id="next">
        <div>
          <div class="eyebrow" id="nextLabel">Next prayer</div>
          <div class="name-row">
            <span class="name" id="nextName">Loading</span>
            <span class="name-ar" id="nextNameAr"></span>
          </div>
          <div class="sub" id="nextSub">&nbsp;</div>
        </div>
        <div class="count-wrap">
          <div class="eyebrow" id="countLabel">&nbsp;</div>
          <div class="count" id="count">--</div>
        </div>
      </section>

      <section class="table" id="table">
        <div class="row head">
          <span>Prayer</span>
          <span class="col-time">Adhan</span>
          <span class="col-time">Iqamah</span>
        </div>
        <div id="rows"></div>
      </section>

      <section class="board" id="board">
        <img id="imgA" alt="" />
        <img id="imgB" alt="" />
        <div class="alert" id="alert">
          <div class="alert-tag">Important notice</div>
          <div class="alert-title" id="alertTitle"></div>
          <div class="alert-text" id="alertText"></div>
        </div>
      </section>

      <section class="ticker hidden" id="ticker">
        <div class="ticker-label">Notices</div>
        <div class="ticker-track"><div class="ticker-inner" id="tickerInner"></div></div>
      </section>

      <footer class="footer">
        <div class="contact">
          <span>(905) 347-2633</span><span>contact@mosqueaisha.ca</span>
        </div>
        <div class="status" id="status"><i></i><span id="statusText">Loading…</span></div>
      </footer>

      <div class="dim" id="dim"></div>
    </div>
  </div>

  <script src="./screen.js"></script>
</body>
</html>
