name: Update prayer times

# Copies today's times for every Mosque Aisha location from api.mosqueaisha.ca
# into prayerTimes.json. The display reads this file whenever it can't reach
# the API directly (the API only allows requests from mosqueaisha.ca).
# The admin page's "Refresh prayer times now" button runs this too.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}

# Nothing by default; the one job below gets only what it needs
permissions: {}

concurrency:
  group: prayer-times
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # to commit prayerTimes.json, nothing else
    env:
      API: https://api.mosqueaisha.ca/mosque-api
      # Some shared hosts block requests that don't say who they are
      UA: "Mozilla/5.0 (compatible; MosqueAishaDisplay/1.0; +https://github.com/Amasud5550/mosque-aisha-display)"
    steps:
      # Pinned to an exact commit so a hijacked tag can't run code with write access (v6.1.0, runs on Node 24)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Fetch times from mosqueaisha.ca
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          get() { curl -fsS --proto =https --max-filesize 200000 --retry 3 --retry-delay 5 --max-time 20 -A "$UA" -H "Accept: application/json" "$API/$1"; }

          get prayerTimes/locations > "$tmp/locs.json"
          get prayerTimes/date      > "$tmp/date.json" || echo '{}' > "$tmp/date.json"
          # Everything from the API is checked before it can reach the screens.
          # A failed check stops the job and leaves the last good times in place.
          jq -e 'type == "array" and length > 0 and length <= 20
                 and all(.[]; (.id | type) == "number" and .id == (.id | floor) and .id > 0 and .id < 1000
                              and (.name | type) == "string" and (.name | test("^[A-Za-z0-9 ()&,.\u0027-]{1,80}$")))' \
            "$tmp/locs.json" > /dev/null || { echo "::error::Unexpected locations data from mosqueaisha.ca"; exit 1; }

          echo '[]' > "$tmp/all.json"
          for id in $(jq -r '.[].id' "$tmp/locs.json"); do
            get "prayerTimes/regular/$id" > "$tmp/p.json"
            jq -e 'def t: type == "string" and test("^[0-9]{1,2}:[0-9]{2}(:[0-9]{2})?$");
                   type == "array" and length >= 4 and length <= 20
                   and all(.[]; (.name | type) == "string" and (.name | test("^[A-Za-z0-9 \u0027-]{1,40}$"))
                                and (.time | t) and ((.start // "00:00") | t)
                                and ((.is_jummah // false) | type) == "boolean"
                                and ((.jummah_order // 1) | type) == "number")' \
              "$tmp/p.json" > /dev/null || { echo "::error::Unexpected prayer data for location $id from mosqueaisha.ca"; exit 1; }
            jq --slurpfile p "$tmp/p.json" --slurpfile l "$tmp/locs.json" --argjson id "$id" \
              '. + [{ id: $id, name: ([$l[0][] | select(.id == $id) | .name][0]), prayers: $p[0] }]' \
              "$tmp/all.json" > "$tmp/next.json"
            mv "$tmp/next.json" "$tmp/all.json"
          done

          # "locations" is what the new screen reads. The flat fajr/dhuhr/... fields
          # (first location's iqamah times) keep the old index.html working too.
          jq -n \
            --slurpfile all "$tmp/all.json" \
            --slurpfile d "$tmp/date.json" \
            --arg day "$(TZ=America/Toronto date +%F)" \
            '($all[0][0].prayers) as $p
             | def iq(f): ([$p[] | select(f) | .time][0] // null);
             {
               day: $day,
               date: ($d[0].date // null),
               locations: $all[0],
               fajr:    iq(.name == "Fajr"),
               dhuhr:   iq(.name == "Dhuhr"),
               asr:     iq(.name == "Asr"),
               maghrib: iq(.name == "Maghrib"),
               isha:    iq(.name == "Isha"),
               jumah1:  iq(.is_jummah and .jummah_order == 1),
               jumah2:  iq(.is_jummah and .jummah_order == 2)
             }' > "$tmp/out.json"

          # Only write when the times themselves change (keeps commit history quiet)
          if [ -f prayerTimes.json ] && jq -e --slurpfile new "$tmp/out.json" 'del(.updatedAt) == $new[0]' prayerTimes.json > /dev/null 2>&1; then
            echo "No change."
          else
            jq --arg at "$(date -u +%FT%TZ)" '. + { updatedAt: $at }' "$tmp/out.json" > prayerTimes.json
          fi
          cat prayerTimes.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add prayerTimes.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update prayer times $(TZ=America/Toronto date +%F)"
            git pull --rebase --quiet
            git push
          fi
